<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">2025 provisional pertussis incidence and case burden by reporting jurisdiction</title>
  <desc id="desc">Two horizontal bar charts show the ten jurisdictions with the highest incidence per 100,000 and the ten with the largest case counts.</desc>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="60" y="62" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#102a43">Pertussis surveillance priorities, 2025</text>
  <text x="60" y="96" font-family="Arial, sans-serif" font-size="18" fill="#486581">High incidence and high workload do not always point to the same jurisdictions</text>
  <rect x="55" y="125" width="525" height="535" rx="16" fill="#ffffff" stroke="#d9e2ec"/>
  <rect x="620" y="125" width="525" height="535" rx="16" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="85" y="170" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#102a43">Highest incidence per 100,000</text>
  <text x="650" y="170" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#102a43">Largest provisional case counts</text>
  <g font-family="Arial, sans-serif" font-size="15" fill="#243b53">
