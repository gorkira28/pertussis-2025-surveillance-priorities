  <line x1="60" y1="690" x2="1140" y2="690" stroke="#bcccdc"/>
  <text x="60" y="720" font-family="Arial, sans-serif" font-size="15" fill="#486581">CDC 2025 Provisional Pertussis Surveillance Report • 52 reporting jurisdictions • U.S. total: 28,783 cases; 8.46 per 100,000</text>
  <text x="60" y="746" font-family="Arial, sans-serif" font-size="13" fill="#627d98">Provisional data are subject to revision. Counts and incidence support different planning decisions.</text>
