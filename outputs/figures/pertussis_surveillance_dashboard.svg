    <text x="85" y="430">Colorado</text><rect x="190" y="413" width="157" height="20" rx="4" fill="#2c7a7b"/><text x="357" y="430">19.15</text>
    <text x="85" y="473">South Dakota</text><rect x="190" y="456" width="156" height="20" rx="4" fill="#2c7a7b"/><text x="356" y="473">18.93</text>
    <text x="85" y="516">Alaska</text><rect x="190" y="499" width="155" height="20" rx="4" fill="#2c7a7b"/><text x="355" y="516">18.92</text>
    <text x="85" y="559">Alabama</text><rect x="190" y="542" width="155" height="20" rx="4" fill="#2c7a7b"/><text x="355" y="559">18.83</text>
    <text x="85" y="602">Nebraska</text><rect x="190" y="585" width="150" height="20" rx="4" fill="#2c7a7b"/><text x="350" y="602">18.25</text>
  </g>
